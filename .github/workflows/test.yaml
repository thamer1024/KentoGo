# Run the tests and the checks on Windows, macOS and Linux, for every push and pull request.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Check the code style
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Run the tests
        run: uv run pytest
